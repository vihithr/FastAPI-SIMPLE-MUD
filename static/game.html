<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUD RPG - 游戏</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617 0, #020617 45%, #000 100%);
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #111827;
      background: linear-gradient(to right, #020617, #020617);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f9fafb;
    }
    header .right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #9ca3af;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #6b7280;
      box-shadow: 0 0 0 1px rgba(17,24,39,0.8);
    }
    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.8);
    }
    .status-dot.connecting {
      background: #eab308;
      box-shadow: 0 0 8px rgba(234,179,8,0.8);
    }
    .status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239,68,68,0.8);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 260px minmax(0, 1.4fr) 260px;
      gap: 10px;
      padding: 10px 10px 12px;
      box-sizing: border-box;
    }
    @media (max-width: 960px) {
      main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto;
      }
    }
    .panel {
      border-radius: 14px;
      background: radial-gradient(circle at top left, rgba(30,64,175,0.45), rgba(15,23,42,0.98));
      border: 1px solid rgba(55,65,81,0.9);
      padding: 10px 10px 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      box-sizing: border-box;
    }
    .panel h2 {
      margin: 0 0 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #9ca3ff;
    }
    .panel small {
      font-size: 11px;
      color: #9ca3af;
    }
    #charName {
      font-weight: 600;
      font-size: 15px;
      margin-top: 2px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 4px;
    }
    .bar {
      margin-top: 4px;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #020617;
      overflow: hidden;
      border: 1px solid #111827;
    }
    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e, #22c55e);
      width: 0%;
    }
    .bar-fill.mp {
      background: linear-gradient(90deg, #3b82f6, #6366f1);
    }
    #centerPanel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #log {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: radial-gradient(circle at top, #020617, #020617);
      border-radius: 10px;
      border: 1px solid #111827;
      padding: 8px;
      box-sizing: border-box;
      /* 使用视口高度的百分比，超出时滚动 */
      height: 65vh;
      max-height: 65vh;
      flex: 0 0 auto;
      overflow-y: auto;
      color: #e5e7eb;
      margin-bottom: 8px;
    }
    .log-line.system { color: #9ca3af; }
    .log-line.info { color: #a5b4fc; }
    .log-line.error { color: #fecaca; }
    .log-line.combat { color: #f97316; }
    .log-line.room { color: #6ee7b7; }
    .controls-group {
      margin-top: 6px;
    }
    .controls-group-title {
      font-size: 12px;
      color: #9ca3ff;
      margin-bottom: 4px;
    }
    .room-info-name {
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }
    .room-info-desc {
      font-size: 11px;
      color: #d1d5db;
      margin-top: 4px;
      white-space: pre-wrap;
    }
    .room-info-exits {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .mini-map-box {
      margin-top: 6px;
      padding: 6px 8px;
      border: 1px solid #1f2937;
      border-radius: 10px;
      background: radial-gradient(circle at top left, rgba(59,130,246,0.05), rgba(15,23,42,0.96));
    }
    #miniMapSvg {
      width: 100%;
      height: 200px;
      display: block;
      margin-top: 6px;
      background: rgba(2,6,23,0.7);
      border-radius: 8px;
      border: 1px solid #111827;
    }
    #miniMapScale {
      width: 100%;
      margin-top: 6px;
    }
    .btn-sm:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, auto);
      gap: 4px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .dpad button {
      padding: 6px 4px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
    }
    .dpad button.main {
      background: radial-gradient(circle at top, #4b5563, #111827);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .btn-sm {
      flex: 1 1 47%;
      padding: 7px 5px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .btn-sm.primary {
      background: linear-gradient(135deg, #4a6bff, #7b5cff);
      border-color: rgba(129,140,248,0.85);
    }
    .cmd-input {
      margin-top: 8px;
    }
    .cmd-input input {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border-radius: 999px;
      border: 1px solid #1f2937;
      padding: 7px 9px;
      color: #e5e7eb;
      font-size: 12px;
    }
    .cmd-input button {
      margin-top: 6px;
      width: 100%;
      padding: 7px 9px;
      border-radius: 999px;
      border: 1px solid rgba(129,140,248,0.85);
      background: linear-gradient(135deg, #4a6bff, #7b5cff);
      color: #f9fafb;
      font-size: 12px;
      cursor: pointer;
    }
    .bottom-links {
      padding: 0 10px 8px;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
    }
    .bottom-links a {
      color: #a5b4fc;
      text-decoration: none;
    }
    #charCreateMessage.ok {
      color: #bbf7d0;
    }
    #charCreateMessage.err {
      color: #fecaca;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MUD RPG</h1>
    </div>
    <div class="right">
      <span id="userLabel">未登录</span>
      <span class="status-dot" id="connDot"></span>
      <span id="connText">未连接</span>
      <button id="connectBtn" style="margin-left:6px;padding:5px 9px;border-radius:999px;border:1px solid rgba(129,140,248,0.8);background:transparent;color:#e5e7eb;font-size:11px;cursor:pointer;">连接</button>
      <button id="disconnectBtn" style="padding:5px 9px;border-radius:999px;border:1px solid #4b5563;background:transparent;color:#9ca3af;font-size:11px;cursor:pointer;">断开</button>
    </div>
  </header>
  <main>
    <section class="panel" id="leftPanel">
      <h2>角色</h2>
      <div id="charCreateBox" style="display:none;">
        <div style="margin-bottom:10px;font-size:12px;color:#9ca3af;">
          你还没有创建角色，请先创建角色才能进入游戏。
        </div>
        <form id="charCreateForm">
          <label style="display:block;margin-bottom:6px;font-size:12px;">角色名</label>
          <input id="charNameInput" type="text" placeholder="输入角色名" required style="width:100%;box-sizing:border-box;padding:7px 9px;border-radius:8px;border:1px solid #1f2937;background:#020617;color:#e5e7eb;font-size:12px;margin-bottom:8px;" />
          <button type="submit" style="width:100%;padding:8px;border-radius:999px;border:1px solid rgba(129,140,248,0.85);background:linear-gradient(135deg, #4a6bff, #7b5cff);color:#f9fafb;font-size:12px;cursor:pointer;">创建角色</button>
        </form>
        <div id="charCreateMessage" style="margin-top:8px;font-size:11px;min-height:20px;"></div>
      </div>
      <div id="charInfoBox">
        <div id="charName">未加载角色</div>
        <div class="stat-row">
          <span>等级</span><span id="charLevel">-</span>
        </div>
        <div class="stat-row">
          <span>经验</span><span id="charExp">-</span>
        </div>
        <div class="stat-row">
          <span>生命</span><span id="charHpLabel">-</span>
        </div>
        <div class="bar"><div id="hpBar" class="bar-fill"></div></div>
        <div class="stat-row" style="margin-top:6px;">
          <span>魔力</span><span id="charMpLabel">-</span>
        </div>
        <div class="bar"><div id="mpBar" class="bar-fill mp"></div></div>
        <div class="stat-row" style="margin-top:6px;">
          <span>攻击</span><span id="charAtk">-</span>
        </div>
        <div class="stat-row">
          <span>防御</span><span id="charDef">-</span>
        </div>
        <div class="controls-group" style="margin-top:10px;">
          <div class="controls-group-title">系统</div>
          <div class="btn-row">
            <button class="btn-sm primary" id="btnRefreshChar">刷新角色</button>
            <button class="btn-sm" id="btnHelp">帮助 (help)</button>
          </div>
        </div>
        <div class="mini-map-box">
          <div class="controls-group-title">迷你地图</div>
          <input id="miniMapScale" type="range" min="0.6" max="1.4" step="0.1" value="1">
          <svg id="miniMapSvg" viewBox="0 0 200 200" aria-label="mini map"></svg>
        </div>
      </div>
    </section>

    <section class="panel" id="centerPanel">
      <h2>冒险日志</h2>
      <div id="currentRoomBox" class="panel" style="margin-bottom:8px;padding:6px 8px;background:radial-gradient(circle at top left, rgba(34,197,94,0.06), rgba(15,23,42,0.98));border-color:#064e3b;">
        <div class="controls-group-title">当前位置</div>
        <div id="currentRoomName" class="room-info-name">未知地点</div>
        <div id="currentRoomDesc" class="room-info-desc">连接后输入 look 查看房间信息。</div>
        <div id="currentRoomExits" class="room-info-exits">出口: -</div>
      </div>
      <div id="log"></div>
      <div class="cmd-input">
        <input id="cmdInput" placeholder="如: look / north / attack goblin / say hello" />
        <button id="sendBtn">发送指令</button>
      </div>
    </section>

    <section class="panel" id="rightPanel">
      <h2>指令</h2>
      <small>使用按钮或输入指令控制角色。</small>
      <div id="commandsContainer" style="margin-top:8px;"></div>
      <div class="controls-group">
        <div class="controls-group-title">日志</div>
        <div class="btn-row">
          <button class="btn-sm" id="btnClearLog">清空日志</button>
        </div>
      </div>
    </section>
  </main>
  <div class="bottom-links">
    <span><a href="/">返回首页</a></span>
    <span><a href="/auth">切换账号</a></span>
  </div>

  <script type="module">
    import { setupGamePage } from "/static/js/game-ui.js";
    setupGamePage();
  </script>
</body>
</html>
