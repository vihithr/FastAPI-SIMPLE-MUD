<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册 - MUD RPG</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: #f5f5f5;
    }
    main {
      width: min(520px, 96vw);
      padding: 22px 20px 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(10,12,32,0.96), rgba(7,10,26,0.96));
      box-shadow: 0 18px 45px rgba(0,0,0,0.8);
      border: 1px solid rgba(103,140,255,0.4);
      backdrop-filter: blur(10px);
    }
    h2 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 14px; font-size: 13px; color: #cbd5ff; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: #d1d5ff;
    }
    .tab.active {
      background: linear-gradient(135deg, #4a6bff, #7b5cff);
      border-color: rgba(129, 140, 248, 0.8);
      color: #fff;
    }
    form {
      margin-top: 6px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }
    input {
      width: 100%;
      margin-top: 4px;
      padding: 9px 10px;
      border-radius: 9px;
      border: 1px solid #4b5563;
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      font-size: 14px;
      box-sizing: border-box;
    }
    button[type="submit"] {
      width: 100%;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #4a6bff, #7b5cff);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .links {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #a5b4fc;
    }
    .links a {
      color: #c4b5fd;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    #message {
      margin-top: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      min-height: 32px;
    }
    #message.ok { color: #bbf7d0; }
    #message.err { color: #fecaca; }
  </style>
</head>
<body>
  <main>
    <h2>登录 / 注册</h2>
    <p>登录后，token 会保存在本地，点击下方按钮可直接进入游戏世界。</p>
    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">登录</button>
      <button id="tab-register" class="tab" type="button">注册</button>
    </div>
    <form id="loginForm">
      <label>用户名
        <input name="username" autocomplete="username" required />
      </label>
      <label>密码
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">登录</button>
    </form>
    <form id="registerForm" style="display:none;">
      <label>用户名
        <input name="username" autocomplete="username" required />
      </label>
      <label>密码
        <input name="password" type="password" autocomplete="new-password" required />
      </label>
      <button type="submit">注册</button>
    </form>
    <div class="links">
      <span><a href="/">返回首页</a></span>
      <span><a href="/game">直接进入游戏 &raquo;</a></span>
    </div>
    <div id="message"></div>
  </main>

  <script type="module">
    import { setupAuthPage } from "/static/js/auth.js";
    setupAuthPage();
  </script>
</body>
</html>
